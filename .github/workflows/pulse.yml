# language: YAML, file: .github/workflows/pulse.yml, target: GitHub Actions ubuntu-latest
# relógio do bot. o schedule nativo do GitHub não dispara nesta conta (testado em
# repo privado e público), então a corrente se mantém sozinha: cada run enfileira
# a próxima ANTES de dormir 280s. se uma run morrer, a seguinte já está na fila.
name: pulse

on:
  schedule:
    - cron: "0 6 * * *"   # re-semente diária, só para o caso da corrente quebrar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  BOT_REPO: dnzzx/hsa-bot

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: é a hora?
        id: hora
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          cfg = json.load(open("schedule.json", encoding="utf-8"))
          agora = datetime.now(ZoneInfo("America/Sao_Paulo"))
          if not cfg.get("enabled"):
              print("tick=false")
              raise SystemExit

          hh, mm = (int(x) for x in cfg["time"].split(":"))
          alvo = agora.replace(hour=hh, minute=mm, second=0, microsecond=0)
          delta = (agora - alvo).total_seconds() / 60

          print(f"tick={'true' if 0 <= delta < 10 else 'false'}")
          print(f"count={max(1, int(cfg.get('count', 1)))}")
          print(f"info={agora:%H:%M} alvo={cfg['time']} delta={delta:.0f}min")
          PY

      - name: enfileirar a próxima
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh workflow run pulse.yml -R "$GITHUB_REPOSITORY"

      - name: disparar o bot
        if: steps.hora.outputs.tick == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh workflow run reel.yml -R "$BOT_REPO" -f count=${{ steps.hora.outputs.count }}
          echo "bot disparado: count=${{ steps.hora.outputs.count }} | ${{ steps.hora.outputs.info }}"

      - name: espaçar
        if: always()
        run: sleep 280
